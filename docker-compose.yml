services:
  postgres:
    image: postgres:latest
    container_name: hisaabkitaab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hkadmin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: hisaabkitaab
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-hk:/var/lib/postgresql
      - ./src/backend/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hkadmin -d hisaabkitaab"]
      interval: 10s
      timeout: 5s
      retries: 5

  renderer:
    build: ./src/renderer
    container_name: hisaabkitaab-renderer
    restart: unless-stopped
    # Deliberately no depends_on frontend, though the scheduled reports do open it by service
    # name (see REPORTS_PAGE_BASE_URL below): frontend already depends on backend, and backend
    # on renderer, so declaring it would close a cycle compose refuses to start. Nothing is
    # lost — the name is resolved when a report is rendered, not at boot, and the first one is
    # a scheduled minute away.
    ports:
      - "3000:3000"

  backend:
    build: ./src/backend
    container_name: hisaabkitaab-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hisaabkitaab
      PDF_RENDERER_URL: http://renderer:3000
      # Where the renderer opens the report pages. The frontend container, by service name —
      # not the public hostname: this URL is walked by our own browser on our own network, and
      # the nginx there proxies /api back to this service, so the page's own calls stay
      # same-origin and never leave the compose network.
      REPORTS_PAGE_BASE_URL: ${REPORTS_PAGE_BASE_URL:-http://frontend}
      # Signs the short-lived tokens those pages authenticate with. Generated per process when
      # unset, which is fine for one backend; set it once there is more than one.
      REPORTS_SECRET: ${REPORTS_SECRET:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Karachi}
      # Set PDF_DUMP_DIR=/pdf-dumps to keep every rendered PDF under ./pdf-dumps on the
      # host — the sent ones, and the ones the frontend's dev-tools gear renders on demand
      # (see DevToolsController), which is the point of having it while debugging a layout.
      PDF_DUMP_DIR: ${PDF_DUMP_DIR:-}
      BREVO_MAIL_USER_IDENTIFIER: ${BREVO_MAIL_USER_IDENTIFIER}
      BREVO_SMPTP_KEY: ${BREVO_SMPTP_KEY}
      EMAIL_ENABLED: ${EMAIL_ENABLED}
      PLANS_ENABLED: ${PLANS_ENABLED}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      renderer:
        condition: service_started
    volumes:
      - ./pdf-dumps:/pdf-dumps
    ports:
      - "8080:8080"

  frontend:
    build: ./src/frontend
    container_name: hisaabkitaab-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

  admin:
    build: ./src/admin
    container_name: hisaabkitaab-admin
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "81:80"

volumes:
  postgres-data-hk:
