spring:
  application:
    name: hisaabkitaab

  jackson:
    deserialization:
      fail-on-null-for-primitives: false

  # Database properties
  datasource:
    url: jdbc:postgresql://localhost:5432/hisaabkitaab
    username: hkadmin
    password: admin
    driver-class-name: org.postgresql.Driver
  flyway:
    locations: classpath:migrations
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  # Email properties
  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${BREVO_MAIL_USER_IDENTIFIER:hisaabKitaab}@smtp-brevo.com
    password: ${BREVO_SMPTP_KEY:password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    root: INFO
    # At INFO this layer is a running account of what changed: every write is bracketed by an
    # arrival and a departure line, and the service in between says what it did and to what.
    # Reads and CORS preflights sit one level down, so DEBUG is the setting for reproducing a
    # problem and INFO the one for leaving it on.
    io.github.baeyung.hisaabkitaab: ${LOG_LEVEL:DEBUG}
    org.springframework.web: ${WEB_LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}
    # SQL_LOG_LEVEL=DEBUG prints the statements themselves. Off by default: it is the answer
    # to "which query is slow", and far too much noise to be the answer to anything else.
    org.hibernate.SQL: ${SQL_LOG_LEVEL:INFO}
  pattern:
    correlation: "[%X{traceId:-        }] "
  file:
    name: ${LOG_FILE:logs/hisaabkitaab.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 500MB

app:
  logging:
    # A request that beats this is logged and forgotten; one that does not is logged at WARN
    # with a SLOW marker, whatever status it returned. Set for a shopkeeper's expectation of
    # "instant", not for a timeout — the point is to catch the ones that worked but felt broken.
    slow-request-ms: ${SLOW_REQUEST_MS:1500}
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    api-base-url: ${WHATSAPP_API_BASE_URL:https://graph.facebook.com/v25.0}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    document-template: ${WHATSAPP_DOCUMENT_TEMPLATE:document_share}
  pdf:
    renderer-url: ${PDF_RENDERER_URL:http://localhost:3000}
    dump-dir: ${PDF_DUMP_DIR:}
  reports:
    # Where the renderer opens the report pages. Not frontend-base-url below: that is the
    # public address, meant for links a person clicks in an email, and this is walked by our
    # own headless browser on our own network. In Docker it is the frontend container by
    # service name; in dev it is the Angular dev server.
    page-base-url: ${REPORTS_PAGE_BASE_URL:http://localhost:4200}
    # Signs the five-minute tokens those pages read with. Generated per process when blank.
    secret: ${REPORTS_SECRET:}
  frontend-base-url: ${FRONTEND_BASE_URL:https://aapka.hisaabkitaab.shop}
  # The shop's own clock. Everything a shopkeeper enters is already a plain business date with
  # no timezone in it; this is only what the scheduler reads to know what "today" and "20:00"
  # mean, and without it a report set for the evening would go out in the middle of the night.
  timezone: ${APP_TIMEZONE:Asia/Karachi}
  email:
    enabled: ${EMAIL_ENABLED:false}
  verification:
    enabled: ${app.email.enabled}
  plans:
    enabled: ${PLANS_ENABLED:true}
  admin:
    emails: ${ADMIN_EMAILS:t@t.com}
