spring:
  application:
    name: hisaabkitaab

  # Database properties
  datasource:
    url: jdbc:postgresql://localhost:5432/hisaabkitaab
    username: hkadmin
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  # Email properties
  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${BREVO_MAIL_USER_IDENTIFIER:hisaabKitaab}@smtp-brevo.com
    password: ${BREVO_SMPTP_KEY:password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Logging. Every line carries the request's trace id (see RequestLogFilter), which is also
# returned to the caller as the X-Trace-Id header and in the JSON error body — so a reported
# failure can be grepped straight out of the log file.
logging:
  level:
    root: INFO
    # TRACE also prints the stack trace behind every 4xx, not just 5xx.
    io.github.baeyung.hisaabkitaab: ${LOG_LEVEL:DEBUG}
    # Flip these on when a request misbehaves before it reaches a controller / when SQL is suspect.
    org.springframework.web: ${WEB_LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:INFO}
  pattern:
    # Slots into Spring Boot's default console/file patterns, so colours and defaults survive.
    correlation: "[%X{traceId:-        }] "
  file:
    name: ${LOG_FILE:logs/hisaabkitaab.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 500MB

# Base URL of the Angular app; used to build the links in outgoing emails.
app:
  frontend-base-url: ${FRONTEND_BASE_URL:https://aapka.hisaabkitaab.shop}
  email:
    # Master switch for outgoing mail. Off (dev) means MailService drops every message
    # instead of dialling the SMTP relay — nothing else in the app changes.
    enabled: ${EMAIL_ENABLED:false}
  admin:
    # Verified HisaabKitaab accounts whose email is listed here also hold ROLE_ADMIN and may
    # use the admin app. Nothing is stored on the user row — moving admin rights between
    # environments is a config change, and an account listed here can never be locked out.
    emails: ${ADMIN_EMAILS:ahmadsheikh617@gmail.com}
  cors:
    # Browser origins allowed to call this API: the user app (4200) and the admin app (4201)
    # in dev, plus whatever they are deployed as. Comma-separated.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201,https://aapka.hisaabkitaab.shop}
  verification:
    # Set to false (e.g. in dev) to skip email verification entirely: new signups are
    # created already-verified with no email sent, and the "verified" access gate is
    # relaxed to plain authentication so existing unverified accounts get in too.
    # Tracks the mail switch: gating access on a code we can't deliver locks everyone out.
    enabled: ${app.email.enabled}
