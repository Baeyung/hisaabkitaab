spring:
  flyway:
    enabled: false

  datasource:
    url: jdbc:h2:mem:hkapi;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  mail:
    username: hisaabKitaab@smtp-brevo.com
    password: password

# Default the general API tests to the dev-like relaxed gate: they exercise CRUD, not
# the verification flow, so signups are born verified. VerificationApiTest flips this
# back on via @TestPropertySource to cover the actual gate.
app:
  verification:
    enabled: false
  # Same reasoning as the flag above, and the same shape: the general API tests exercise
  # CRUD, not entitlements, and a shared TRIAL ceiling of one shop and one user would have
  # them failing on their second store rather than on anything they are about to assert.
  # PlanEnforcementApiTest and PlansDisabledApiTest each name the value they want via
  # @TestPropertySource, so neither depends on what is set here.
  #
  # Stated explicitly because application.yaml ships `enabled: ${PLANS_ENABLED:true}` — the
  # tests would otherwise inherit production's switch and change behaviour with it.
  plans:
    enabled: false
