server {
    listen 80;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        # $http_host, not $host: $host drops the port, so on any port but 80 the backend
        # computes its own origin as http://<name> while the browser sends
        # http://<name>:<port>. Spring then reads a same-origin write as a CORS request and
        # answers 403 "Invalid CORS request" — which is what the admin app on :81 hit.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
