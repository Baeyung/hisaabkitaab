@if (api.credentials()) {
  <div class="min-h-dvh bg-desk flex flex-col">
    <!-- Top rail. Carries the wordmark and nothing else: the frame says which
         building you are in, the sidebar says which room. -->
    <header class="bg-panel border-b border-[var(--rule)]">
      <div class="flex items-baseline gap-3 px-5 py-3.5 md:px-7">
        <span class="font-display font-600 tracking-[0.18em] text-sm text-ink">HISAABKITAAB</span>
        <span class="h-3 w-px bg-[var(--rule-strong)]" aria-hidden="true"></span>
        <span class="font-mono text-xs text-brass">back office</span>
        <button
          type="button"
          (click)="signOut()"
          class="ml-auto text-xs text-faint hover:text-vermilion underline underline-offset-4"
        >
          Sign out
        </button>
      </div>
    </header>

    <div class="flex flex-1 flex-col md:flex-row">
      <nav
        class="bg-panel border-b border-[var(--rule)] md:w-60 md:shrink-0 md:border-b-0 md:border-r flex flex-col"
        aria-label="Back office"
      >
        <p class="eyebrow px-5 pt-5 pb-2.5 md:px-6 max-md:hidden">Menu</p>

        <!-- routerLinkActive carries the whole of "which room you are in": the
             resting item is plain, the current one takes the pine rule. -->
        <a
          routerLink="/users"
          routerLinkActive="bg-[color-mix(in_srgb,var(--color-pine)_12%,transparent)] border-pine text-ink"
          ariaCurrentWhenActive="page"
          class="flex items-center gap-2.5 mx-3 my-2 md:my-0 md:mx-3 px-3 py-2.5 rounded border-l-2 border-transparent text-sm font-500 text-muted no-underline hover:text-ink"
        >
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            class="text-pine shrink-0"
            aria-hidden="true"
          >
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="M3 10h18M8 5v14" />
          </svg>
          User plan management
        </a>

        <a
          routerLink="/whatsapp-blocks"
          routerLinkActive="bg-[color-mix(in_srgb,var(--color-pine)_12%,transparent)] border-pine text-ink"
          ariaCurrentWhenActive="page"
          class="flex items-center gap-2.5 mx-3 my-2 md:my-0 md:mx-3 px-3 py-2.5 rounded border-l-2 border-transparent text-sm font-500 text-muted no-underline hover:text-ink"
        >
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            class="text-pine shrink-0"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="9" />
            <path d="M5.6 5.6l12.8 12.8" />
          </svg>
          WhatsApp blocks
        </a>

        <div class="mt-auto px-6 py-4 border-t border-[var(--rule)] max-md:hidden">
          <p class="eyebrow mb-1">Signed in</p>
          <p class="font-mono text-xs text-muted break-all">{{ admin() }}</p>
        </div>
      </nav>

      <main class="flex-1 min-w-0">
        <router-outlet />
      </main>
    </div>
  </div>
} @else {
  <app-login />
}
