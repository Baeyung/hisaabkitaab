server {
    listen 80;

    location /api/ {
        proxy_pass http://backend:8080/api/;
        # A WhatsApp'd khata posts the printable page itself — markup plus every stylesheet
        # the app is wearing. A dense multi-page statement clears nginx's 1MB default.
        client_max_body_size 10m;
        # Keep the port: see src/admin/nginx.conf. Harmless on :80, and the same 403 the
        # moment this is ever served anywhere else.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
